# Renders the Remotion project in abidin-ai-remotion/ to MP4 and publishes it to the branch renders-remotion-<name>.
# Run from the Actions tab (works from a phone browser). No paid services are called: Remotion only assembles
# clips you already put in abidin-ai-remotion/public/assets/.
#   enable_footage = Yes  -> turns ENABLE_FOOTAGE on (clips are used; every file listed in episode.ts must exist)
#   enable_footage = No   -> text/graphic cards only (good for a quick layout check)
#   still_only     = Yes  -> only renders a thumbnail PNG (fast, ~1 min)
name: render-remotion
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Output name (branch will be renders-remotion-<name>)"
        default: abidin-ai
      enable_footage:
        description: "Use the MP4 clips in public/assets?"
        type: choice
        options: ["No", "Yes"]
        default: "No"
      still_only:
        description: "Only render a thumbnail (fast)?"
        type: choice
        options: ["No", "Yes"]
        default: "No"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: abidin-ai-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve name
        working-directory: .
        env:
          INPUT_NAME: ${{ inputs.name }}
        run: |
          N=$(printf '%s' "$INPUT_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9\n-' '-' | sed 's/^-*//; s/-*$//')
          [ -n "$N" ] || N=abidin-ai
          echo "NAME=$N" >> "$GITHUB_ENV"
      - name: Install Chromium libraries + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libxkbcommon-dev libxrandr2 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libasound2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Report assets
        run: |
          echo "Clips referenced by episode.ts:"
          for f in $(grep -o "assets/[a-z0-9-]*\.mp4" src/episode.ts | sort -u); do
            if [ -f "public/$f" ]; then echo "  OK       $f"; else echo "  MISSING  $f"; fi
          done
      - name: Turn footage on
        if: ${{ inputs.enable_footage == 'Yes' }}
        run: |
          missing=0
          for f in $(grep -o "assets/[a-z0-9-]*\.mp4" src/episode.ts | sort -u); do
            [ -f "public/$f" ] || { echo "::error::public/$f is missing"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          sed -i 's/const ENABLE_FOOTAGE=false;/const ENABLE_FOOTAGE=true;/' src/Video.tsx
      - name: Render thumbnail
        if: ${{ inputs.still_only == 'Yes' }}
        run: npx remotion still src/index.ts AbidinAffiliate out/thumbnail.png
      - name: Render MP4
        if: ${{ inputs.still_only != 'Yes' }}
        run: |
          npx remotion render src/index.ts AbidinAffiliate out/abidin-ai.mp4 --codec=h264 --crf=23 --concurrency=2
          ffprobe -v error -show_entries format=duration,size -of csv=p=0 out/abidin-ai.mp4
          ffmpeg -nostdin -loglevel error -y -i out/abidin-ai.mp4 -vf "fps=1/3,scale=180:-2,tile=8x5" -frames:v 1 out/contact-sheet.png
      - name: Collect output
        run: |
          mkdir -p /tmp/out
          [ -f out/abidin-ai.mp4 ] && cp out/abidin-ai.mp4 /tmp/out/video.mp4 || true
          [ -f out/contact-sheet.png ] && cp out/contact-sheet.png /tmp/out/ || true
          [ -f out/thumbnail.png ] && cp out/thumbnail.png /tmp/out/ || true
          ls -la /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-${{ env.NAME }}
          path: /tmp/out/*
          if-no-files-found: error
      - name: Publish to branch renders-remotion-${{ env.NAME }}
        run: |
          cd /tmp/out
          git init -q -b renders-remotion-${{ env.NAME }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Remotion render ${{ env.NAME }} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders-remotion-${{ env.NAME }}
