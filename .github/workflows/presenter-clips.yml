# Makes the lip-sync presenter clips (hook + closing) for a video that has assets/presenter/presenter.png.
# Steps: ElevenLabs VO (cached, committed) -> cut audio at the cue words -> Kling Avatar v2 Standard (~$0.056/s, ~20 s total) -> commit clips.
# dry=Yes only computes the slices and the price, no fal call. Needs secrets ELEVENLABS_API_KEY and FAL_KEY.
name: presenter-clips
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video folder name, e.g. hemat-listrik"
        default: hemat-listrik
      dry:
        description: "Yes = only compute slices + price (free for fal)"
        type: choice
        options: ["Yes", "No"]
        default: "Yes"
permissions:
  contents: write
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Voice-over (cached if already committed)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          D="videos/${{ inputs.video }}"
          [ -f "$D/script.json" ] || { echo "::error::$D not found"; exit 1; }
          node plugins/hyperframe-pro/scripts/tts.mjs "$D/script.json" "$D/assets/vo"
      - name: Presenter clips
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          D="videos/${{ inputs.video }}"
          if [ "${{ inputs.dry }}" = "Yes" ]; then node plugins/hyperframe-pro/scripts/presenter-clips.mjs "$D" --dry
          else node plugins/hyperframe-pro/scripts/presenter-clips.mjs "$D"; fi
      - name: Commit VO + clips
        if: ${{ inputs.dry == 'No' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "videos/${{ inputs.video }}/assets/vo" "videos/${{ inputs.video }}/assets/presenter"
          git commit -m "Presenter clips: ${{ inputs.video }}" || echo "nothing to commit"
          git pull --rebase -q origin main
          git push origin HEAD:main
