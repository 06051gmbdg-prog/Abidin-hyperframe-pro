# Otomatis: 2 video otomotif per hari (naskah Anthropic API + footage Pixabay + presenter lip-sync fal + suara ElevenLabs),
# render, lalu jadwalkan ke Buffer (YouTube/Instagram/Facebook) jam 12:00 dan 16:00 WIB hari itu.
# Secrets: ANTHROPIC_API_KEY, PIXABAY_API_KEY, ELEVENLABS_API_KEY, FAL_KEY, BUFFER_TOKEN
name: auto-daily
on:
  schedule:
    - cron: "30 1 * * *"   # 08:30 WIB
  workflow_dispatch:
    inputs:
      count:
        description: "Jumlah video (1-2)"
        default: "2"
      mode:
        description: "full = produksi + jadwalkan / dry = hanya naskah + footage (tanpa biaya fal, tanpa posting)"
        type: choice
        default: full
        options: [full, dry]
permissions:
  contents: write
concurrency:
  group: auto-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cek secrets
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          P: ${{ secrets.PIXABAY_API_KEY }}
          E: ${{ secrets.ELEVENLABS_API_KEY }}
          F: ${{ secrets.FAL_KEY }}
          B: ${{ secrets.BUFFER_TOKEN }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          miss=""
          [ -n "$A" ] || miss="$miss ANTHROPIC_API_KEY"
          [ -n "$P" ] || miss="$miss PIXABAY_API_KEY"
          if [ "$MODE" = full ]; then
            [ -n "$E" ] || miss="$miss ELEVENLABS_API_KEY"
            [ -n "$F" ] || miss="$miss FAL_KEY"
            [ -n "$B" ] || miss="$miss BUFFER_TOKEN"
          fi
          if [ -n "$miss" ]; then echo "::error::Secret belum diisi:$miss (Settings > Secrets and variables > Actions)"; exit 1; fi
      - name: Produksi dan jadwalkan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '2' }}
          MODE: ${{ inputs.mode || 'full' }}
        run: bash plugins/hyperframe-pro/scripts/auto-daily.sh
